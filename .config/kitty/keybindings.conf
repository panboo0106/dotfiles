# =============================================================================
# kitty keybindings - neovim style
# =============================================================================
# based on neovim keybindings for muscle memory consistency
# kitty_mod = ctrl+shift (can be customized)
#
# leader = kitty_mod+space —— 序列前缀,对应 nvim 的 <leader>(事实标准 <space>)
#   取代原来的 f7>:F 键在 macOS 默认是媒体键,f7 实际要按 fn+F7(右上角伸手 +
#   3 次按键);leader 是 左小指+左无名指+拇指,不离 home row。
# =============================================================================

kitty_mod ctrl+shift

# -----------------------------------------------------------------------------
# tab management (vim-style: gt/gt)
# -----------------------------------------------------------------------------
# _with_cwd 变体:新 tab 归属当前 session,否则会被 tab_bar_filter 挡在侧栏外
map kitty_mod+t new_tab_with_cwd
# macOS 内置 cmd+t 默认是裸 new_tab,同样要覆盖(本文件唯一一处 cmd+* 覆盖)
map cmd+t new_tab_with_cwd
map kitty_mod+q close_tab
map kitty_mod+apostrophe set_tab_title

# tab navigation (using ] and [ like vim's ]b/[b)
map kitty_mod+] next_tab
map kitty_mod+[ previous_tab

# move tab position (kitty default)
map kitty_mod+period move_tab_forward
map kitty_mod+comma move_tab_backward

# quick tab switch (alt+number)
map alt+1 goto_tab 1
map alt+2 goto_tab 2
map alt+3 goto_tab 3
map alt+4 goto_tab 4
map alt+5 goto_tab 5
map alt+6 goto_tab 6
map alt+7 goto_tab 7
map alt+8 goto_tab 8
map alt+9 goto_tab 9
map alt+0 goto_tab 10

# -----------------------------------------------------------------------------
# split management (vim-style: ctrl+w + v/s)
# -----------------------------------------------------------------------------
# horizontal split (like ctrl+w+s)
map kitty_mod+s launch --location=hsplit

# vertical split (like ctrl+w+v)
map kitty_mod+v launch --location=vsplit

# close window (like ctrl+w+q)
map kitty_mod+x close_window

# navigate windows (like ctrl+w + h/j/k/l)
map kitty_mod+h neighboring_window left
map kitty_mod+j neighboring_window down
map kitty_mod+k neighboring_window up
map kitty_mod+l neighboring_window right

# resize windows (like ctrl+w + < > + -)
map ctrl+alt+h resize_window narrower
map ctrl+alt+l resize_window wider
map ctrl+alt+k resize_window taller
map ctrl+alt+j resize_window shorter

# -----------------------------------------------------------------------------
# scrolling (vim-style: ctrl+u/d/b/f)
# -----------------------------------------------------------------------------
# scroll half page up/down
map kitty_mod+u scroll_page_up
map kitty_mod+d scroll_page_down

# scroll full page up/down(b/f 与 ghostty 一致;fullscreen 两边都有系统级
# ctrl+cmd+f 兜底,f 释放给滚动)
map kitty_mod+b scroll_page_up
map kitty_mod+f scroll_page_down

# scroll to top/bottom(vim 的 gg/G 在 ctrl+shift 下无法区分大小写,改用
# Home/End 消歧,与 ghostty 一致)
map kitty_mod+home scroll_home
map kitty_mod+end scroll_end

# scroll by line
map kitty_mod+up scroll_line_up
map kitty_mod+down scroll_line_down

# -----------------------------------------------------------------------------
# searching (vim-style: /, n, n)
# -----------------------------------------------------------------------------
# search (like /) —— 必须是 search_scrollback;show_scrollback 只把 scrollback
# 丢进 pager,不搜索,与注释意图不符
map kitty_mod+/ search_scrollback

# jump between shell prompts(kitty_mod=ctrl+shift 无法区分 n/N,故 prev 挪到 leader>n)
map kitty_mod+n scroll_to_prompt 1
map kitty_mod+space>n scroll_to_prompt -1

# -----------------------------------------------------------------------------
# clipboard (vim-style: y, p)
# -----------------------------------------------------------------------------
# yank/copy (like y)
map kitty_mod+y copy_to_clipboard

# paste (like p)
# 代价(知情保留):这行把 kitty_mod+p 由 prefix 降为 leaf,静默废掉整棵默认 hints
# 子树(>f >shift+f >y >w >l >h >n >c >d)。vim 助记优先,hints 改挂 leader 见下。
map kitty_mod+p paste_from_clipboard

# -----------------------------------------------------------------------------
# hints (抓路径 / URL / 词 / 行) —— 挂 leader
# -----------------------------------------------------------------------------
# 默认挂在 kitty_mod+p> 子树,被上面的 paste 占用,故改挂 leader
map kitty_mod+space>u open_url_with_hints
map kitty_mod+space>f kitten hints --type path --program -
map kitty_mod+space>shift+f kitten hints --type path
map kitty_mod+space>y kitten hints --type hyperlink
map kitty_mod+space>w kitten hints --type word --program -
map kitty_mod+space>l kitten hints --type line --program -
# 低频的不绑,用 kitty_mod+f3 command_palette 搜:
#   hints --type hash / --type linenum / choose-files
# unicode_input 未丢:第二个默认绑定 ctrl+cmd+space 一直可用
# (leader>n 已被 scroll_to_prompt -1 占用,行号故意不绑)

# -----------------------------------------------------------------------------
# utilities (vim-style)
# -----------------------------------------------------------------------------
# clear screen (like :clear)
map kitty_mod+semicolon clear_terminal reset active

# edit scrollback (like :e)
map kitty_mod+e edit_scrollback

# -----------------------------------------------------------------------------
# configuration
# -----------------------------------------------------------------------------
# reload config (like :so %)
map kitty_mod+r load_config_file

# edit config file: 系统级 Cmd+, 原生已是 edit_config_file,无需自定义

# -----------------------------------------------------------------------------
# window control
# -----------------------------------------------------------------------------
# fullscreen: 系统级 ctrl+cmd+f 原生已覆盖,无需自定义(见 scrolling 区 kitty_mod+f)

# toggle maximized
map kitty_mod+m toggle_maximized

# -----------------------------------------------------------------------------
# font size
# -----------------------------------------------------------------------------
map kitty_mod+equal change_font_size all +2.0
map kitty_mod+minus change_font_size all -2.0
map kitty_mod+0 change_font_size all 0

# -----------------------------------------------------------------------------
# session management (native kitty sessions, 0.48+; 配合 kitty.conf 的 tab_bar_filter)
# -----------------------------------------------------------------------------
# 保存当前布局为 session 文件(Ctrl+Shift+O,取代旧的 save_session.sh)
map kitty_mod+o save_as_session --use-foreground-process --base-dir ~/.local/share/kitty/sessions
# 浏览 / 切换 session(选择器,扫描上面的目录)
map kitty_mod+space>/ goto_session --sort-by=alphabetical ~/.local/share/kitty/sessions
# 关闭当前 session
map kitty_mod+space>x close_session

# -----------------------------------------------------------------------------
# other
# -----------------------------------------------------------------------------
# environment info (like :pwd)
map kitty_mod+i show_kitty_env_vars

# -----------------------------------------------------------------------------
# theme switching (light/dark) - real-time, no restart needed
# -----------------------------------------------------------------------------
# use osc escape sequences for instant color change
# run theme-toggle.sh to update config for current session (you can use --type=overlay for next session)
map f5 combine : set_colors ~/.config/kitty/solarized-zen-light.conf : launch --type=background ~/.config/kitty/theme-toggle.sh light
map f6 combine : set_colors ~/.config/kitty/solarized-zen-dark.conf : launch --type=background ~/.config/kitty/theme-toggle.sh dark
