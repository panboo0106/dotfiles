# vim:fileencoding=utf-8:foldmethod=marker

# =============================================================================
# Init {{{
# =============================================================================
term xterm-256color
shell_integration enabled no-cursor
scrollback_lines 100000
mouse_hide_wait 3.0
allow_hyperlinks yes
editor nvim
env PATH=$PATH:/opt/homebrew/bin

# Performance optimization
# repaint_delay: lower = smoother, higher = less CPU
# sync_to_monitor: no reduces input lag on high-refresh displays
repaint_delay 8
input_delay 0
sync_to_monitor no
# }}}

# =============================================================================
# Tab Bar {{{
# =============================================================================
# 竖排侧栏样式:separator 较清爽;可换回 powerline / 试 slant、fade
tab_bar_style separator
# tab_powerline_style angled   # 仅 tab_bar_style=powerline 时生效
# 顶部横向 tab 栏
tab_bar_edge top
# 只有 1 个 tab 时也显示 tab 栏
tab_bar_min_tabs 1
# 只显示当前 session(或未归属 session)的 tab;配合原生 sessions 分组
tab_bar_filter session:~ or session:^$
active_tab_font_style bold
# }}}

# =============================================================================
# Appearance {{{
# =============================================================================
background_opacity 0.98
dynamic_background_opacity yes
font_size 16.0
modify_font cell_height 120%

# Font rendering
disable_ligatures never
box_drawing_scale 0.001, 1, 1.5, 2

# Cursor
cursor_shape beam
cursor_trail 1
cursor_blink_interval 0.5

text_composition_strategy 1.0 0
# }}}

# =============================================================================
# Window {{{
# =============================================================================
macos_traditional_fullscreen yes
macos_option_as_alt left
window_border_width 0.5pt
window_resize_step_cells 5
window_resize_step_lines 5
macos_titlebar_color background
text_composition_strategy 1.0 0
enable_audio_bell yes
notify_on_cmd_finish never
filter_notification all
remember_window_size yes
initial_window_width  140c
initial_window_height 40
hide_window_decorations titlebar-only
window_padding_width 1
confirm_os_window_close 0

# Enable splits layout for proper hsplit/vsplit behavior
enabled_layouts splits,stack

# URL detection
url_style curly
url_prefixes http https ftp ftps file irc

# Selection — kitty 的有效键是 select_by_word_characters(原 terminal_selectable_mark_characters 无效)
# select_by_word_characters @-./_~?&%+#=
# }}}

# =============================================================================
# Security {{{
# =============================================================================
allow_remote_control socket-only
listen_on unix:/tmp/kitty.sock
# }}}

# =============================================================================
# Shell {{{
# =============================================================================
shell zsh
# }}}

# =============================================================================
# Theme {{{
# =============================================================================
# BEGIN_KITTY_THEME
# Available themes:
#   solarized-zen-light.conf — Solarized Zen light (current)
#   solarized-zen-dark.conf  — Solarized Zen dark
include solarized-zen-dark.conf
# END_KITTY_THEME
# }}}

# =============================================================================
# Fonts {{{
# =============================================================================
font_family      Maple Mono NF CN
bold_font        auto
italic_font      auto
bold_italic_font auto
# }}}

# =============================================================================
# Keybindings {{{
# =============================================================================
# Custom keybindings are in a separate file for better organization
# Edit keybindings.conf to modify shortcuts
# =============================================================================
include keybindings.conf
# }}}




